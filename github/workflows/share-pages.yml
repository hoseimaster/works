name: Build archive share pages and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - name: Generate public share pages
        run: node scripts/generate-share-pages.mjs --base-url https://hoseimaster.github.io/works/
      - name: Prepare site artifact
        run: |
          mkdir _site
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='scripts/' --exclude='_site/' --exclude='sql/' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
