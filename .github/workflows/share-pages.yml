name: Build archive share pages and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate public share pages
        run: node scripts/generate-share-pages.mjs --base-url https://hoseimaster.github.io/works/
      - name: Check changes against published site
        id: changes
        env:
          FORCE_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          SHARE_BASE_URL: https://hoseimaster.github.io/works/
        run: node scripts/check-share-deploy.mjs
      - uses: actions/configure-pages@v5
        if: steps.changes.outputs.changed == 'true'
      - name: Prepare site artifact
        if: steps.changes.outputs.changed == 'true'
        run: |
          mkdir _site
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='scripts/' --exclude='_site/' --exclude='sql/' ./ _site/
      - uses: actions/upload-pages-artifact@v3
        if: steps.changes.outputs.changed == 'true'
        with:
          path: _site
      - name: Deploy
        id: deployment
        if: steps.changes.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
      - name: Report no changes
        if: steps.changes.outputs.changed != 'true'
        run: echo 'No changes. Skipped site upload and deployment.'
